<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Panel Pracownika - Walidacja</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .ok { color: green; }
    .missing { color: red; }
    .field { margin: 4px 0; }
    .label { font-weight: bold; }
    #raw { 
      white-space: pre-wrap; 
      background: #f6f6f6; 
      padding: 8px; 
      border: 1px solid #ddd; 
    }
  </style>
</head>
<body>

  <h1>Panel Pracownika</h1>

  <!-- Sekcja uploadu pojedynczego pliku 
     <section>
    <h2>Wgraj dokument</h2>
    <input type="file" id="fileInput" />
    <button id="uploadBtn">Wyślij</button>
    <div id="uploadMsg"></div>
  </section>
  -->

  <!-- Sekcja uploadu wielu plików -->
  <section>
    <h2>Wgraj Dokumenty</h2>
    <input type="file" id="fileInputMultiple" multiple />
    <button id="uploadBtnMultiple">Wyślij dokumenty</button>
    <div id="uploadMsgMultiple"></div>
    <div id="resultsMultiple"></div>
  </section>

  <section>
    <div>
      <button id="compareBtn">Porównaj pliki</button>
    </div>

    <pre id="compareOutput" style="background:#f0f0f0; padding:10px; margin-top:10px;"></pre>
  </section>

  <!-- Sekcja wyników analizy -->
  <section id="analysisSection" style="display:none">
    <h2>Wynik analizy</h2>
    <div>Typ dokumentu: <span id="docType"></span></div>

    <h3>Odczytane pola</h3>
    <div id="extracted"></div>

    <h3>Pola brakujące (wypełnij)</h3>
    <form id="fillForm"></form>
    <button id="saveBtn">Zapisz uzupełnione dane</button>

    <h3>Podgląd wyciągniętego tekstu (fragment)</h3>
    <div id="raw"></div>
  </section>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const uploadMsg = document.getElementById("uploadMsg");

    const uploadBtnMultiple = document.getElementById("uploadBtnMultiple");
    const fileInputMultiple = document.getElementById("fileInputMultiple");
    const uploadMsgMultiple = document.getElementById("uploadMsgMultiple");
    const resultsMultiple = document.getElementById("resultsMultiple");

    const analysisSection = document.getElementById("analysisSection");
    const docTypeEl = document.getElementById("docType");
    const extractedEl = document.getElementById("extracted");
    const fillForm = document.getElementById("fillForm");
    const rawEl = document.getElementById("raw");
    const saveBtn = document.getElementById("saveBtn");

    const compareBtn = document.getElementById("compareBtn");

    let lastFileId = null;
    let lastExtracted = {};
    let lastMissing = [];

    compareBtn.onclick = async () => {
    // przykładowo pobieramy wszystkie pliki *_analysis.json
    const files = await fetch("/results").then(res => res.json());

    const res = await fetch("/compare", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ files })
    });

    const data = await res.json();
    document.getElementById("compareOutput").textContent = JSON.stringify(data, null, 2);

    };

    // --- Upload wielu plików ---
    uploadBtnMultiple.onclick = async () => {
      resultsMultiple.innerHTML = "";
      uploadMsgMultiple.textContent = "";
      analysisSection.style.display = "none";

      const files = fileInputMultiple.files;
      if (files.length === 0) { alert("Wybierz pliki"); return; }
      if (files.length != 4) {alert("Odpowiedź bedzie nie pewna")}

      uploadMsgMultiple.textContent = `Rozpoczynam wysyłanie ${files.length} plików...`;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileName = file.name;
        uploadMsgMultiple.textContent = `Wysyłam plik ${i + 1}/${files.length}: ${fileName}...`;

        const fd = new FormData();
        fd.append("file", file);

        try {
          const resp = await fetch("/upload", { method: "POST", body: fd });
          const data = await resp.json();

          if (files.length === 1 && !data.error) {
            uploadMsgMultiple.textContent = "Plik przesłany. Wyniki analizy poniżej.";
            lastFileId = data.file_id;
            lastExtracted = data.extracted || {};
            lastMissing = data.missing || [];
            showAnalysis(data);
            return;
          }

          const resultItem = document.createElement("div");
          resultItem.className = "field";

          if (data.error) {
            resultItem.innerHTML = `<span class="label">${fileName}:</span> <span class="missing">BŁĄD: ${data.error}</span>`;
          } else {
            const docType = data.document_type || "nie rozpoznano";
            resultItem.innerHTML = `<span class="label">${fileName}:</span> <span class="ok">OK - Typ: ${docType} (ID: ${data.file_id})</span>`;
          }
          resultsMultiple.appendChild(resultItem);

        } catch (e) {
          console.error(e);
          const resultItem = document.createElement("div");
          resultItem.className = "field";
          resultItem.innerHTML = `<span class="label">${fileName}:</span> <span class="missing">Błąd sieci/serwera</span>`;
          resultsMultiple.appendChild(resultItem);
        }
      }

      uploadMsgMultiple.textContent = `Zakończono wysyłanie wszystkich ${files.length} plików.`;
    };

    // --- Upload pojedynczego pliku ---
    uploadBtn.onclick = async () => {
      uploadMsg.textContent = "";
      analysisSection.style.display = "none";
      extractedEl.innerHTML = "";
      fillForm.innerHTML = "";
      rawEl.textContent = "";

      const file = fileInput.files[0];
      if (!file) { alert("Wybierz plik"); return; }

      const fd = new FormData();
      fd.append("file", file);

      uploadMsg.textContent = "Wysyłam plik...";
      try {
        const resp = await fetch("/upload", { method: "POST", body: fd });
        const data = await resp.json();
        if (data.error) {
          uploadMsg.textContent = "Błąd: " + data.error;
          return;
        }
        uploadMsg.textContent = "Plik przesłany. Wyniki analizy poniżej.";
        lastFileId = data.file_id;
        lastExtracted = data.extracted || {};
        lastMissing = data.missing || [];
        showAnalysis(data);
      } catch (e) {
        console.error(e);
        uploadMsg.textContent = "Błąd sieci.";
      }
    };

    // --- Wyświetlenie analizy ---
    function showAnalysis(data) {
      analysisSection.style.display = "block";
      docTypeEl.textContent = data.document_type || "nie rozpoznano";
      extractedEl.innerHTML = "";

      for (const [k,v] of Object.entries(data.extracted || {})) {
        const div = document.createElement("div");
        div.className = "field";
        div.innerHTML = `<span class="label">${k}:</span> <span class="${v? 'ok':'missing'}">${v || '(brak)'}</span>`;
        extractedEl.appendChild(div);
      }

      fillForm.innerHTML = "";
      (data.missing || []).forEach(field => {
        const row = document.createElement("div");
        row.className = "field";
        row.innerHTML = `<label class="label">${field}: </label><input name="${field}" />`;
        fillForm.appendChild(row);
      });

      rawEl.textContent = data.raw_text_preview || "";
    }

    // --- Zapis uzupełnionych danych ---
    saveBtn.onclick = async () => {
      const inputs = fillForm.querySelectorAll("input");
      const filled = {};
      inputs.forEach(i => { filled[i.name] = i.value; });

      const merged = {...lastExtracted, ...filled};
      const body = { file_id: lastFileId, filled_fields: merged };

      try {
        const resp = await fetch("/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (data.status === "saved") {
          alert("Zapisano wynik. Ścieżka: " + data.path);
        } else {
          alert("Błąd zapisu");
        }
      } catch (e) {
        console.error(e);
        alert("Błąd sieci");
      }
    };
  </script>

</body>
</html>
