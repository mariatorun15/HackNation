<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EWYP Chatbot — ZANT v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#f0f2f5; --card:#ffffff; --accent:#0052a3; --muted:#666; --bot-bg:#eef3f8; --user-bg:#0052a3; }
    *{box-sizing:border-box}
    body{ margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:#333; height:100vh; display:flex; padding:20px; gap:20px; justify-content:center;}

    /* Layout */
    .app-container { display:flex; width:100%; max-width:1100px; background:var(--card); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.05); overflow:hidden; }

    /* Sidebar */
    .sidebar { width:320px; background:#f8fafc; border-right:1px solid #e2e8f0; padding:20px; display:flex; flex-direction:column; }
    .logo { font-weight:700; font-size:18px; color:var(--accent); margin-bottom:5px; }
    .subtitle { font-size:12px; color:var(--muted); margin-bottom:20px; line-height:1.4; }
    .status-box { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; font-size:13px; margin-bottom:10px; }
    .status-title { font-weight:600; margin-bottom:4px; font-size:11px; text-transform:uppercase; color:var(--muted); }
    .doc-list { font-size:13px; margin-top:auto; }
    .doc-list li { margin-bottom:4px; color:var(--muted); }

    /* Chat Area */
    .main { flex:1; display:flex; flex-direction:column; position:relative; }
    .chat-window { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }

    .msg { max-width:80%; padding:12px 16px; border-radius:12px; line-height:1.5; font-size:15px; position:relative; animation:fadeIn 0.3s ease; }
    .msg.bot { background:var(--bot-bg); color:#1e293b; align-self:flex-start; border-bottom-left-radius:2px; }
    .msg.user { background:var(--user-bg); color:#fff; align-self:flex-end; border-bottom-right-radius:2px; }
    .msg strong { font-weight:600; }

    /* Input Area */
    .input-area { padding:20px; background:#fff; border-top:1px solid #e2e8f0; display:flex; flex-direction:column; gap:10px; }
    .options-row { display:flex; gap:8px; flex-wrap:wrap; }
    .option-btn { background:#fff; border:1px solid #cbd5e1; color:#334155; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; transition:0.2s; }
    .option-btn:hover { background:#f1f5f9; border-color:#94a3b8; }

    .text-row { display:flex; gap:10px; }
    input[type="text"] { flex:1; padding:12px; border:1px solid #cbd5e1; border-radius:8px; outline:none; font-size:15px; }
    input[type="text"]:focus { border-color:var(--accent); ring:2px solid rgba(0,82,163,0.1); }

    button.send-btn { background:var(--accent); color:white; border:none; padding:0 24px; border-radius:8px; font-weight:600; cursor:pointer; transition:0.2s; }
    button.send-btn:hover { background:#003d7a; }
    button.send-btn:disabled { background:#cbd5e1; cursor:not-allowed; }

    .action-btn { width:100%; padding:12px; margin-top:10px; background:#10b981; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; display:none; }
    .action-btn:hover { background:#059669; }

    .system-note { font-size:12px; color:#ef4444; margin-top:4px; display:none; }

    @keyframes fadeIn { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }

    /* Spinner */
    .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width: 800px) {
      .sidebar { display:none; }
      .app-container { max-width:100%; height:100%; border-radius:0; }
      body { padding:0; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="sidebar">
    <div class="logo">ZANT — Asystent Wypadkowy</div>
    <div class="subtitle">System wspomagania zgłoszeń wypadków przy pracy dla osób prowadzących działalność gospodarczą.</div>

    <div class="status-box">
      <div class="status-title">Twoja Firma (z CEIDG)</div>
      <div id="companyInfo" style="color:#94a3b8; font-style:italic;">(Oczekiwanie na NIP...)</div>
    </div>

    <div class="status-box">
      <div class="status-title">Postęp zgłoszenia</div>
      <div id="progressInfo">0%</div>
    </div>

    <div style="margin-top:20px; font-weight:600; font-size:13px; color:var(--accent)">Wykryte braki / Wskazówki:</div>
    <ul class="doc-list" id="hintsList">
      <li>Rozpocznij czat, aby przeanalizować wypadek.</li>
    </ul>
  </div>

  <div class="main">
    <div class="chat-window" id="chat">
      </div>

    <div class="input-area">
      <div class="options-row" id="optionsRow"></div>

      <div class="text-row">
        <input type="text" id="userInput" placeholder="Wpisz odpowiedź..." autocomplete="off">
        <button class="send-btn" id="sendBtn">Wyślij</button>
      </div>
      <div class="system-note" id="validationMsg"></div>

      <button class="action-btn" id="downloadPdfBtn">Pobierz Dokumentację (PDF)</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){
  // --- KONFIGURACJA PYTAŃ (SCENARIUSZ) ---
  const scenario = [
    {
      id: 'tryb',
      text: 'Dzień dobry. Jestem wirtualnym asystentem ZUS. Pomogę Ci zgłosić wypadek przy prowadzeniu działalności. Co chcesz zrobić?',
      type: 'choice',
      options: ['Zgłoszenie wypadku (Zawiadomienie)', 'Wyjaśnienia poszkodowanego', 'Oba dokumenty jednocześnie']
    },
    {
      id: 'rola',
      text: 'W jakim charakterze występujesz?',
      type: 'choice',
      options: ['Jestem poszkodowanym (przedsiębiorca)', 'Jestem pełnomocnikiem / członkiem rodziny'],
      hint: 'Jeśli jesteś pełnomocnikiem, system przypomni o załączeniu pełnomocnictwa.'
    },
    {
      id: 'nip',
      text: 'Podaj NIP działalności gospodarczej poszkodowanego. Pozwoli mi to pobrać dane z CEIDG (symulacja).',
      type: 'text',
      validate: (val) => /^\d{10}$/.test(val.replace(/\D/g,'')) ? true : 'NIP musi składać się z 10 cyfr.'
    },
    // --- BLOK DANYCH OSOBOWYCH (Skrócony na potrzeby demo) ---
    { id: 'imie', text: 'Podaj imię poszkodowanego:', type: 'text' },
    { id: 'nazwisko', text: 'Podaj nazwisko poszkodowanego:', type: 'text' },

    // --- BLOK OKOLICZNOŚCI (Analiza 4 elementów wypadku) ---
    {
      id: 'data_godzina',
      text: 'Kiedy doszło do zdarzenia? Podaj datę i godzinę (np. 01.12.2024 14:30).',
      type: 'text',
      validate: (val) => val.length > 5 // prosta walidacja
    },
    {
      id: 'miejsce',
      text: 'Gdzie dokładnie miał miejsce wypadek? (Adres lub opis miejsca)',
      type: 'text'
    },
    {
      id: 'analiza_intro',
      text: 'Teraz przeanalizujemy przebieg zdarzenia, aby ustalić, czy spełnia ono ustawowe znamiona wypadku przy pracy. Będę pytał o szczegóły.',
      type: 'info' // Informacja, nie pytanie
    },
    {
      id: 'czynnosc_przed',
      text: 'Co dokładnie robiłeś/aś w momencie tuż przed wypadkiem? Jaki miało to związek z prowadzoną działalnością?',
      type: 'text',
      hint: 'Np. "Rozładowywałem towar dla klienta", "Jechałem do biura księgowego". To kluczowe dla ustalenia związku z pracą.'
    },
    {
      id: 'zdarzenie',
      text: 'Co się wydarzyło? Opisz nagłe zdarzenie (np. upadek, uderzenie, poślizgnięcie).',
      type: 'text',
      hint: 'Wypadek musi być zdarzeniem nagłym.'
    },
    {
      id: 'przyczyna_zew',
      text: 'Jaka była przyczyna zewnętrzna tego zdarzenia? Co sprawiło, że do niego doszło?',
      type: 'text',
      hint: 'Np. "Plama oleju na posadzce", "Wadliwe działanie maszyny", "Uderzenie przez inny pojazd". Nie może to być przyczyna tkwiąca wyłącznie w organizmie (np. zawał bez wysiłku).'
    },
    {
      id: 'uraz',
      text: 'Jakich obrażeń doznałeś/aś w wyniku tego zdarzenia?',
      type: 'text',
      hint: 'Np. "Złamanie nogi", "Rana cięta dłoni". Musi wystąpić uraz medyczny.'
    },

    // --- BLOK MEDYCZNY I ŚWIADKOWIE ---
    {
      id: 'dokumentacja_med',
      text: 'Czy posiadasz dokumentację medyczną potwierdzającą uraz (np. wypis ze szpitala, zaświadczenie od lekarza)?',
      type: 'choice',
      options: ['TAK', 'NIE - dostarczę później', 'NIE - nie byłem u lekarza']
    },
    {
      id: 'swiadkowie',
      text: 'Czy byli świadkowie zdarzenia?',
      type: 'choice',
      options: ['TAK', 'NIE']
    },
    // Pytanie warunkowe (logika w JS obsłuży showIf)
    {
      id: 'dane_swiadkow',
      text: 'Podaj dane świadków (Imię, Nazwisko, adres/kontakt) - jest to ważne dla celów dowodowych.',
      type: 'text',
      condition: (answers) => answers.swiadkowie === 'TAK'
    },

    // --- ZAKOŃCZENIE ---
    {
      id: 'koniec',
      text: 'Dziękuję. Zebrałem niezbędne informacje. Przeanalizowałem zgłoszenie. Kliknij poniżej, aby wygenerować dokumenty i instrukcję.',
      type: 'end'
    }
  ];

  // --- STAN APLIKACJI ---
  let currentStep = 0;
  const answers = {};
  const chatWindow = document.getElementById('chat');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const optionsRow = document.getElementById('optionsRow');
  const validationMsg = document.getElementById('validationMsg');
  const companyInfoBox = document.getElementById('companyInfo');
  const hintsList = document.getElementById('hintsList');
  const progressInfo = document.getElementById('progressInfo');
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');

  // --- FUNKCJE POMOCNICZE ---

  function addMsg(text, sender = 'bot') {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerHTML = text; // allow HTML
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function updateSidebar(key, val) {
    // 1. Symulacja CEIDG po wpisaniu NIP
    if(key === 'nip') {
      companyInfoBox.innerHTML = '<span class="spinner"></span> Pobieram dane z CEIDG...';
      setTimeout(() => {
        // Symulacja danych na podstawie NIP (zawsze sukces w demo)
        const pkd = '41.20.Z'; // Roboty budowlane
        const nazwa = `FIRMA USŁUGOWA "JAN-BUD" ${answers.nazwisko || ''}`;
        answers['_pkd'] = pkd;
        answers['_firma'] = nazwa;

        companyInfoBox.innerHTML = `
          <strong>${nazwa}</strong><br>
          NIP: ${val}<br>
          PKD wiodące: ${pkd}<br>
          <span style="color:green; font-size:11px">● Status: Aktywna</span>
        `;
        addMsg(`Pobrałem dane Twojej firmy z CEIDG: <strong>${nazwa} (PKD: ${pkd})</strong>. System dostosuje pytania do branży budowlanej.`, 'bot');
      }, 1500);
    }

    // 2. Aktualizacja listy braków/wskazówek
    if(key === 'rola' && val.includes('pełnomocnik')) {
      const li = document.createElement('li');
      li.style.color = '#d97706';
      li.innerText = '❗ Wymagane załączenie pełnomocnictwa (OL-PEL).';
      hintsList.appendChild(li);
    }

    if(key === 'dokumentacja_med' && val.includes('NIE - nie byłem')) {
        const li = document.createElement('li');
        li.style.color = 'red';
        li.innerText = '❗ Brak dokumentacji medycznej utrudni uznanie wypadku.';
        hintsList.appendChild(li);
        addMsg('UWAGA: Brak wizyty u lekarza może skutkować nieuznaniem zdarzenia za wypadek (brak dowodu urazu). Zalecana pilna konsultacja lekarska.', 'bot');
    }

    // 3. Pasek postępu
    const prog = Math.round((currentStep / scenario.length) * 100);
    progressInfo.innerText = `${prog}%`;
    progressInfo.style.background = `linear-gradient(90deg, #dbeafe ${prog}%, transparent ${prog}%)`;
  }

  function nextStep() {
    if(currentStep >= scenario.length) return;

    const q = scenario[currentStep];

    // Sprawdzenie warunku (jeśli pytanie warunkowe)
    if(q.condition && !q.condition(answers)) {
      currentStep++;
      nextStep();
      return;
    }

    if(q.type === 'end') {
      addMsg(q.text, 'bot');
      userInput.disabled = true;
      sendBtn.disabled = true;
      optionsRow.innerHTML = '';
      downloadPdfBtn.style.display = 'block';
      return;
    }

    if(q.type === 'info') {
      addMsg(q.text, 'bot');
      currentStep++;
      setTimeout(nextStep, 1000); // Automatyczne przejście
      return;
    }

    // Render pytania
    let html = `<strong>${q.text}</strong>`;
    if(q.hint) html += `<br><span style="font-size:13px; color:#666; font-style:italic">💡 ${q.hint}</span>`;

    addMsg(html, 'bot');

    // UI Inputu
    userInput.value = '';
    optionsRow.innerHTML = '';
    validationMsg.style.display = 'none';

    if(q.type === 'choice') {
      userInput.style.display = 'none';
      sendBtn.style.display = 'none';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleInput(opt);
        optionsRow.appendChild(btn);
      });
    } else {
      userInput.style.display = 'block';
      sendBtn.style.display = 'block';
      userInput.focus();
    }
  }

  function handleInput(val) {
    const q = scenario[currentStep];

    // Walidacja
    if(q.validate) {
      const check = q.validate(val);
      if(check !== true) {
        validationMsg.innerText = check;
        validationMsg.style.display = 'block';
        return;
      }
    }

    // Zapis odpowiedzi
    answers[q.id] = val;

    // Wizualizacja odpowiedzi usera
    if(q.type !== 'choice') addMsg(val, 'user');
    else addMsg(val, 'user'); // też pokaż co kliknął

    // Efekty uboczne (sidebar, logika)
    updateSidebar(q.id, val);

    currentStep++;
    setTimeout(nextStep, 500);
  }

  // --- EVENT LISTENERS ---
  sendBtn.addEventListener('click', () => {
    const txt = userInput.value.trim();
    if(txt) handleInput(txt);
  });

  userInput.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') sendBtn.click();
  });

  // --- PDF GENERATOR (Rozbudowany) ---
  downloadPdfBtn.addEventListener('click', async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const btn = downloadPdfBtn;

    btn.innerHTML = '<span class="spinner"></span> Generowanie PDF...';

    // Pobieranie czcionki PL (konieczne dla polskich znaków)
    try {
        const fontRes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.66/fonts/Roboto/Roboto-Regular.ttf');
        const fontBuf = await fontRes.arrayBuffer();
        const fontBase64 = btoa(new Uint8Array(fontBuf).reduce((data, byte) => data + String.fromCharCode(byte), ''));

        doc.addFileToVFS("Roboto.ttf", fontBase64);
        doc.addFont("Roboto.ttf", "Roboto", "normal");
        doc.setFont("Roboto");
    } catch(e) {
        console.warn("Brak czcionki PL, znaki mogą być zniekształcone");
    }

    let y = 20;
    const margin = 15;

    // NAGŁÓWEK
    doc.setFontSize(18);
    doc.setTextColor(0, 82, 163);
    doc.text("Karta Wypadku / Zgłoszenie (Projekt ZANT)", margin, y);
    y += 10;

    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Data wygenerowania: ${new Date().toLocaleDateString()}`, margin, y);
    y += 15;

    // SEKCJA 1: DANE
    doc.setFontSize(12);
    doc.setTextColor(0);
    doc.setFillColor(240, 242, 245);
    doc.rect(margin, y-5, 180, 8, 'F');
    doc.text("I. Dane Zgłaszającego i Firmy", margin+2, y);
    y += 10;

    const printLine = (label, val) => {
        doc.setFontSize(10);
        doc.setTextColor(80);
        doc.text(label, margin, y);
        doc.setTextColor(0);
        const splitVal = doc.splitTextToSize(val || "---", 120);
        doc.text(splitVal, margin + 50, y);
        y += (splitVal.length * 5) + 3;
    };

    printLine("Tryb zgłoszenia:", answers.tryb);
    printLine("Rola:", answers.rola);
    printLine("Firma (z NIP):", answers._firma);
    printLine("Kod PKD:", answers._pkd);
    printLine("Poszkodowany:", `${answers.imie} ${answers.nazwisko}`);

    y += 5;

    // SEKCJA 2: ANALIZA WYPADKU
    doc.setFillColor(240, 242, 245);
    doc.rect(margin, y-5, 180, 8, 'F');
    doc.setTextColor(0);
    doc.setFontSize(12);
    doc.text("II. Analiza okoliczności (Drzewo przyczyn)", margin+2, y);
    y += 10;

    printLine("Czas i miejsce:", `${answers.data_godzina}, ${answers.miejsce}`);
    printLine("Czynność przed (Związek z pracą):", answers.czynnosc_przed);
    printLine("Zdarzenie (Nagłość):", answers.zdarzenie);
    printLine("Przyczyna zewn.:", answers.przyczyna_zew);
    printLine("Skutek (Uraz):", answers.uraz);

    if(answers.swiadkowie === 'TAK') {
       printLine("Świadkowie:", answers.dane_swiadkow);
    } else {
       printLine("Świadkowie:", "Brak");
    }

    y += 10;

    // SEKCJA 3: INSTRUKCJA (ZANT Requirement 5 & 6)
    if(y > 220) { doc.addPage(); y=20; }

    doc.setDrawColor(0, 82, 163);
    doc.setLineWidth(0.5);
    doc.line(margin, y, 195, y);
    y += 10;

    doc.setFontSize(14);
    doc.setTextColor(0, 82, 163);
    doc.text("Twoja spersonalizowana lista zadań", margin, y);
    y += 10;

    doc.setFontSize(11);
    doc.setTextColor(0);

    const todo = [];
    todo.push("1. Wydrukuj i podpisz niniejsze zawiadomienie.");
    if(answers.rola && answers.rola.includes('pełnomocnik')) {
        todo.push("2. DOŁĄCZ PEŁNOMOCNICTWO (Druk OL-PEL) - jest wymagane, bo działasz w imieniu innej osoby.");
    }
    if(answers.dokumentacja_med === 'TAK') {
        todo.push("3. Skompletuj dokumentację medyczną (Karta informacyjna ze szpitala, historia choroby).");
    } else {
        todo.push("3. UWAGA: Udaj się do lekarza, aby uzyskać potwierdzenie urazu. Bez tego ZUS może odmówić świadczeń.");
    }
    todo.push("4. Złóż komplet dokumentów przez PUE ZUS (eZUS) lub w placówce.");

    todo.forEach(item => {
       const lines = doc.splitTextToSize(item, 170);
       doc.text(lines, margin, y);
       y += (lines.length * 6) + 4;
    });

    // Stopka
    y = 280;
    doc.setFontSize(9);
    doc.setTextColor(150);
    doc.text("Dokument wygenerowany przez system ZANT (Prototyp). Nie stanowi decyzji administracyjnej.", margin, y);

    doc.save("Zgloszenie_ZANT.pdf");

    btn.innerHTML = "Pobrano PDF";
  });

  // START
  // Opóźnienie startu dla efektu ładowania
  setTimeout(() => nextStep(), 500);

})();
</script>
</body>
</html>
