<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Panel pracownika</title>
</head>
<body>
  <h1>Panel pracownika</h1>

    <!-- Sekcja uploadu -->
    <section id="upload-section">
        <h2>Wgraj dokument</h2>
        <input type="file" id="fileInput" />
        <button id="uploadBtn">Wyślij</button>
        <div id="status"></div>
        <ul id="missing-fields"></ul>
    </section>

     <!-- Sekcja historii (opcjonalnie) -->
    <section id="history-section">
        <h2>Historia dokumentów</h2>
        <ul id="historyList"></ul>
    </section>

  <div id="result"></div>

  <script src="scripts/panel.js"></script>

  <p><a href="/">Powrót</a></p>
</body>
</html>
